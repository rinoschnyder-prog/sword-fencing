<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一撃必殺！ソード・フェンシング</title>
    <link rel="stylesheet" href="style.css">
    <!-- Socket.ioライブラリの読み込み -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="game-container">
        <!-- ゲーム中UI -->
        <div id="ui-layer">
            <div>
                <span id="p1-name-display" style="color: #e74c3c;">PLAYER 1</span>
                <div class="score" id="p1-score">
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
            <div id="timer-container">
                <div id="timer">60</div>
                <div id="streak-counter">連勝: 0</div>
            </div>
            <div style="text-align: right;">
                <span id="p2-name-display" style="color: #3498db;">CPU</span>
                <div class="score" id="p2-score">
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>
        
        <!-- タイトル画面 -->
        <div id="title-screen" class="screen">
            <h1>一撃必殺！ソード・フェンシング</h1>
            <div class="subtitle">〜 一瞬の隙を突き、命を刈り取れ 〜</div>
            <button class="menu-btn" onclick="startCPUMode()">CPU戦 (連勝に挑戦)</button>
            <button class="menu-btn" onclick="showOnlineMenu()">対戦モード (オンライン)</button>

            <div id="ranking-board">
                <h3>🏆 歴代連勝記録 TOP 3</h3>
                <div id="ranking-list">
                    <!-- JSで動的に追加 -->
                </div>
            </div>
        </div>

        <!-- ルーム（パスワード）入力画面 -->
        <div id="online-screen" class="screen" style="display: none;">
            <h2>オンライン対戦</h2>
            <div id="online-form">
                <input type="text" id="player-name-input" placeholder="あなたの名前" maxlength="8" value="PLAYER">
                <input type="text" id="room-id-input" placeholder="部屋のパスワード" maxlength="12">
                <div>
                    <button class="menu-btn" onclick="connectToRoom()">入室する</button>
                    <button class="menu-btn" style="background-color: #7f8c8d;" onclick="hideOnlineMenu()">戻る</button>
                </div>
            </div>
            <div id="online-status" style="margin-top: 15px; color: #f1c40f;"></div>
        </div>

        <!-- 汎用メッセージ表示用 -->
        <div id="game-overlay" class="screen">
            <div id="overlay-text">ROUND 1</div>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <!-- スマホ・タブレット用バーチャルコントローラー -->
    <div id="touch-controls" style="display: none;">
        <div class="control-group left-group">
            <button id="btn-left" class="touch-btn">◀</button>
            <button id="btn-right" class="touch-btn">▶</button>
        </div>
        <div class="control-group right-group">
            <button id="btn-jump" class="touch-btn action-btn blue">JUMP</button>
            <button id="btn-guard" class="touch-btn action-btn yellow">GUARD</button>
            <button id="btn-attack" class="touch-btn action-btn red">ATTACK</button>
        </div>
    </div>

    <div id="controls-info">
        【PC操作】移動: A, D | ジャンプ: W | ガード: S | 攻撃: F <br>
        【スマホ】画面下のバーチャルパッドで操作
    </div>

    <script src="game.js"></script>
</body>
</html>
