<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>ソード・フェンシング v16.0.2</title>
    
    <!-- ★ 最新バージョン v=16.0.2 -->
    <link rel="stylesheet" href="style.css?v=16.0.2">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="game-container">
        <!-- 全画面ゲームCanvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- 観戦中のみ表示されるタイトル戻るボタン -->
        <button id="btn-exit-watch" onclick="returnToTitle()">✕ 観戦終了</button>

        <!-- スコア・タイマー・HP/SPゲージUI -->
        <div id="ui-layer">
            <div class="player-info p1-info">
                <div class="name-score">
                    <span id="p1-name-display" style="color: #ff5252;">PLAYER 1</span>
                    <div class="score" id="p1-score">
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
                <div class="hp-bar">
                    <div class="hp-fill" id="p1-hp"></div>
                </div>
                <div class="sp-bar">
                    <div class="sp-fill" id="p1-sp"></div>
                </div>
            </div>

            <div id="timer-container">
                <div id="timer">30</div>
                <div id="streak-counter">連勝: 0</div>
            </div>

            <div class="player-info p2-info">
                <div class="name-score" style="justify-content: flex-end;">
                    <div class="score" id="p2-score">
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <span id="p2-name-display" style="color: #40c4ff;">CPU</span>
                </div>
                <div class="hp-bar">
                    <div class="hp-fill" id="p2-hp"></div>
                </div>
                <div class="sp-bar">
                    <div class="sp-fill" id="p2-sp"></div>
                </div>
            </div>
        </div>

        <!-- メインコントローラー -->
        <div id="touch-controls">
            <div class="control-group left-group">
                <button id="btn-left" class="touch-btn">◀</button>
                <button id="btn-right" class="touch-btn">▶</button>
            </div>
            <div class="control-group right-group">
                <button id="btn-jump" class="touch-btn action-btn blue">JUMP</button>
                <button id="btn-guard" class="touch-btn action-btn yellow">GUARD</button>
                <button id="btn-attack" class="touch-btn action-btn red">ATTACK<br><span style="font-size: 8px;">(長押し溜め)</span></button>
            </div>
        </div>

        <!-- SPECIALボタン -->
        <div id="special-control-container">
            <button id="btn-special" class="touch-btn special-btn">⚡ SPECIAL (気功波動弾) ⚡</button>
        </div>
        
        <!-- タイトル画面 -->
        <div id="title-screen" class="screen">
            <button id="daily-login-btn" onclick="claimDailyLoginBonus()">🎁 ログインボーナス！</button>
            <div id="top-gold-display">💰 所持金: <span id="gold-amount">0</span> G</div>

            <h1 class="game-title">ソード・フェンシング</h1>
            <div class="subtitle">〜 30秒決戦！通常10打 / 溜め一撃KO＆必殺波動弾 〜</div>
            
            <button class="menu-btn" onclick="startCPUMode()">CPU戦 (連勝に挑戦)</button>
            <button class="menu-btn" onclick="showOnlineMenu()">対戦モード (オンライン)</button>
            <button class="menu-btn watch-btn" onclick="openBetModal()">観戦・賭けバトル (CPU vs CPU)</button>
            <button class="menu-btn shop-btn" onclick="openShopModal()">🎨 スキン工房 (着替え＆SHOP)</button>

            <div id="ranking-board">
                <h3>🏆 歴代連勝記録 TOP 3</h3>
                <div id="ranking-list"></div>
            </div>

            <div class="title-footer">
                <div class="credit-text">
                    音楽：<a href="https://az-ho.org" target="_blank" rel="noopener noreferrer">独り音</a>
                </div>
                <div id="online-counter">
                    <span class="live-dot"></span>
                    オンライン: <span id="online-count-num">1</span>人
                </div>
            </div>
        </div>

        <!-- 観戦ベッティングモーダル -->
        <div id="bet-screen" class="screen modal-screen" style="display: none;">
            <div class="modal-box">
                <h2>🎰 観戦ベッティング</h2>
                <div class="subtitle">どちらが勝つか予想してゴールドを賭けろ！（的中時 2倍）</div>
                
                <div class="bet-pick-group">
                    <button class="bet-pick-btn active" id="bet-pick-p1" onclick="setBetTarget(1)">
                        <span id="bet-p1-color-box">■</span> CPU 1
                    </button>
                    <button class="bet-pick-btn" id="bet-pick-p2" onclick="setBetTarget(2)">
                        <span id="bet-p2-color-box">■</span> CPU 2
                    </button>
                </div>

                <div class="bet-amount-group">
                    <div style="font-size: 12px; margin-bottom: 4px;">掛け金を選択 (所持: <span class="current-gold-span">0</span>G)</div>
                    <div class="bet-chips">
                        <button class="chip-btn" onclick="setBetAmount(0)">0 G (観戦のみ)</button>
                        <button class="chip-btn active" onclick="setBetAmount(1)">1 G</button>
                        <button class="chip-btn" onclick="setBetAmount(3)">3 G</button>
                        <button class="chip-btn" onclick="setBetAmount(5)">5 G</button>
                        <button class="chip-btn" onclick="setBetAmount('all')">ALL IN</button>
                    </div>
                </div>

                <div class="modal-buttons">
                    <button class="menu-btn" onclick="confirmAndStartBetMatch()">試合開始！</button>
                    <button class="menu-btn cancel-btn" onclick="closeBetModal()">戻る</button>
                </div>
            </div>
        </div>

        <!-- スキン工房モーダル -->
        <div id="shop-screen" class="screen modal-screen" style="display: none;">
            <div class="modal-box shop-box">
                <h2><span onclick="debugAddGold()" style="cursor: pointer; display: inline-block;">🎨</span> スキン工房</h2>
                <div class="shop-gold">💰 所持金: <span class="current-gold-span">0</span> G</div>

                <div class="shop-tabs">
                    <button class="tab-btn active" onclick="switchShopTab('normal')">カラー(通常)</button>
                    <button class="tab-btn" onclick="switchShopTab('armor')">カラー(鎧上下)</button>
                    <button class="tab-btn" onclick="switchShopTab('accessory')">猛者専用スキン</button>
                </div>

                <div id="tab-normal" class="tab-content">
                    <div class="shop-item-title">■ 上半身カラー (各15G)</div>
                    <div class="color-palette-grid" id="normal-body-palette"></div>
                    
                    <div class="shop-item-title" style="margin-top:10px;">■ 下半身カラー (各15G)</div>
                    <div class="color-palette-grid" id="normal-legs-palette"></div>
                </div>

                <div id="tab-armor" class="tab-content" style="display: none;">
                    <div id="armor-unlock-status" style="font-size:11px; color:#ffd32a; text-align:center; margin-bottom:6px;"></div>
                    
                    <div class="shop-item-title">■ 鎧・上半身アーマー (各15G)</div>
                    <div class="color-palette-grid" id="armor-body-palette"></div>
                    
                    <div class="shop-item-title" style="margin-top:10px;">■ 鎧・下半身アーマー (各15G)</div>
                    <div class="color-palette-grid" id="armor-legs-palette"></div>
                </div>

                <div id="tab-accessory" class="tab-content" style="display: none;">
                    <div class="accessory-grid" id="accessory-list"></div>
                </div>

                <div class="modal-buttons" style="margin-top: 15px;">
                    <button class="menu-btn" onclick="closeShopModal()">完了</button>
                </div>
            </div>
        </div>

        <!-- オンライン設定画面 -->
        <div id="online-screen" class="screen" style="display: none;">
            <h2>オンライン対戦</h2>
            <div id="online-form">
                <input type="text" id="player-name-input" placeholder="あなたの名前" maxlength="8" value="PLAYER">
                <input type="text" id="room-id-input" placeholder="部屋のパスワード" maxlength="12">
                <div class="form-buttons">
                    <button class="menu-btn" onclick="connectToRoom()">入室する</button>
                    <button class="menu-btn" style="background-color: #607d8b;" onclick="hideOnlineMenu()">戻る</button>
                </div>
            </div>
            <div id="online-status"></div>
        </div>

        <!-- メッセージオーバーレイ -->
        <div id="game-overlay" class="screen">
            <div id="overlay-text">ROUND 1</div>
        </div>
    </div>

    <!-- ★ 安全な分割読み込み (sound ➔ shop ➔ effects ➔ game) -->
    <script src="sound.js?v=16.0.2"></script>
    <script src="shop.js?v=16.0.2"></script>
    <script src="effects.js?v=16.0.2"></script>
    <script src="game.js?v=16.0.2"></script>
</body>
</html>
