<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>ソード・フェンシング v9.1</title>
    
    <!-- ★ 最新バージョン v=9.1 -->
    <link rel="stylesheet" href="style.css?v=9.1">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="game-container">
        <!-- 全画面ゲームCanvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- スコア・タイマー・HPゲージUI -->
        <div id="ui-layer">
            <div class="player-info p1-info">
                <div class="name-score">
                    <span id="p1-name-display" style="color: #ff5252;">PLAYER 1</span>
                    <div class="score" id="p1-score">
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
                <div class="hp-bar" id="p1-hp">
                    <div class="hp-block active"></div>
                    <div class="hp-block active"></div>
                    <div class="hp-block active"></div>
                    <div class="hp-block active"></div>
                    <div class="hp-block active"></div>
                </div>
            </div>

            <div id="timer-container">
                <div id="timer">30</div>
                <div id="streak-counter">連勝: 0</div>
            </div>

            <div class="player-info p2-info">
                <div class="name-score" style="justify-content: flex-end;">
                    <div class="score" id="p2-score">
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <span id="p2-name-display" style="color: #40c4ff;">CPU</span>
                </div>
                <div class="hp-bar" id="p2-hp">
                    <div class="hp-block active"></div>
                    <div class="hp-block active"></div>
                    <div class="hp-block active"></div>
                    <div class="hp-block active"></div>
                    <div class="hp-block active"></div>
                </div>
            </div>
        </div>

        <!-- 半透明タッチコントローラー -->
        <div id="touch-controls">
            <div class="control-group left-group">
                <button id="btn-left" class="touch-btn">◀</button>
                <button id="btn-right" class="touch-btn">▶</button>
            </div>
            <div class="control-group right-group">
                <button id="btn-jump" class="touch-btn action-btn blue">JUMP</button>
                <button id="btn-guard" class="touch-btn action-btn yellow">GUARD</button>
                <button id="btn-attack" class="touch-btn action-btn red">ATTACK<br><span style="font-size: 8px;">(長押し溜め)</span></button>
            </div>
        </div>
        
        <!-- タイトル画面 -->
        <div id="title-screen" class="screen">
            <h1 class="game-title">ソード・フェンシング</h1>
            <div class="subtitle">〜 30秒決戦！通常5打 / 溜め攻撃一撃KO 〜</div>
            
            <button class="menu-btn" onclick="startCPUMode()">CPU戦 (連勝に挑戦)</button>
            <button class="menu-btn" onclick="showOnlineMenu()">対戦モード (オンライン)</button>

            <div id="ranking-board">
                <h3>🏆 歴代連勝記録 TOP 3</h3>
                <div id="ranking-list"></div>
            </div>
        </div>

        <!-- オンライン設定画面 -->
        <div id="online-screen" class="screen" style="display: none;">
            <h2>オンライン対戦</h2>
            <div id="online-form">
                <input type="text" id="player-name-input" placeholder="あなたの名前" maxlength="8" value="PLAYER">
                <input type="text" id="room-id-input" placeholder="部屋のパスワード" maxlength="12">
                <div class="form-buttons">
                    <button class="menu-btn" onclick="connectToRoom()">入室する</button>
                    <button class="menu-btn" style="background-color: #607d8b;" onclick="hideOnlineMenu()">戻る</button>
                </div>
            </div>
            <div id="online-status"></div>
        </div>

        <!-- メッセージオーバーレイ -->
        <div id="game-overlay" class="screen">
            <div id="overlay-text">ROUND 1</div>
        </div>
    </div>

    <!-- ★ 最新バージョン v=9.1 -->
    <script src="game.js?v=9.1"></script>
</body>
</html>
